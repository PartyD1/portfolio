<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The tab icon is the PD mark on the world's gradient, not the mark alone: at
    16px a two-stroke monogram in currentColor on a transparent ground is a
    grey smudge in either theme. The tile carries the site's own colour so the
    tab is recognisable at the size a tab actually is.

    Stroke is heavier than components/Monogram.tsx (3.6 against 2.4) for the
    same reason: the glyph here is drawn a third the size it ever is on the
    page. Same two paths, same rhythm.

    The translate centres the glyph's own bounds in the tile: the two paths
    span x 10-40 and y 8-33, so their centre is (25, 20.5) and the tile's is
    (32, 32).
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b39ceb"/>
      <stop offset="0.5" stop-color="#f4a97e"/>
      <stop offset="1" stop-color="#6fc4ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <g fill="none" stroke="#26264a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(7, 11.5)">
    <path d="M10 33V8h8.5a6.5 6.5 0 0 1 0 13H10"/>
    <path d="M25 33V15h6a9 9 0 0 1 0 18h-6"/>
  </g>
</svg>
